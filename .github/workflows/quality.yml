name: Cookbook quality
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npm test
      - run: npm run test:auth
      - run: npm run test:ocr
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
      - name: Validate explicit release target with synthetic values
        run: npm run build:release
        env:
          VITE_COOKBOOK_DEMO: '0'
          VITE_FIREBASE_API_KEY: fixture-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-julies-kokebok
          VITE_FIREBASE_APP_ID: fixture-app-id
          COOKBOOK_EXPECTED_PROJECT_ID: demo-julies-kokebok
          COOKBOOK_EXPECTED_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
      - name: Build locked, unconfigured entrance without demo data
        run: npm run build:non-demo
        env:
          VITE_COOKBOOK_DEMO: '0'
      - name: Build configured entrance using synthetic public values
        run: npm run build:non-demo
        env:
          VITE_COOKBOOK_DEMO: '0'
          VITE_FIREBASE_API_KEY: fixture-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-julies-kokebok
          VITE_FIREBASE_APP_ID: fixture-app-id
      - name: Build isolated public demo
        run: npm run build:demo
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_COOKBOOK_DEMO: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cookbook-demo
          path: dist
          if-no-files-found: error
