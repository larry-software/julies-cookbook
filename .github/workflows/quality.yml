name: Cookbook quality
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npm test
      - run: npm run test:auth
      - run: npm run test:ocr
      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
      - name: Validate explicit release target with synthetic values
        run: npm run build:release
        env:
          VITE_COOKBOOK_DEMO: '0'
          VITE_FIREBASE_API_KEY: fixture-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-julies-kokebok
          VITE_FIREBASE_APP_ID: fixture-app-id
          COOKBOOK_EXPECTED_PROJECT_ID: demo-julies-kokebok
          COOKBOOK_EXPECTED_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
      - name: Build locked, unconfigured entrance without demo data
        run: npm run build:non-demo
        env:
          VITE_COOKBOOK_DEMO: '0'
      - name: Build configured entrance using synthetic public values
        run: npm run build:non-demo
        env:
          VITE_COOKBOOK_DEMO: '0'
          VITE_FIREBASE_API_KEY: fixture-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-julies-kokebok.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-julies-kokebok
          VITE_FIREBASE_APP_ID: fixture-app-id
      - name: Build isolated public demo
        run: npm run build:demo
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_COOKBOOK_DEMO: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cookbook-demo
          path: dist
          if-no-files-found: error
